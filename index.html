<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vijaykumar's Mutta Bonda Shop</title>
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #8b1a1a;
      --primary-dark: #5c1010;
      --gold: #f5c518;
      --cream: #fff8f0;
      --text: #2b2b2b;
    }

    body {
      font-family: 'Segoe UI', 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #fff8f0 0%, #ffe9d6 50%, #ffd9b3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== ANIMATED BACKGROUND BLOBS ===== */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: 0;
      animation: blobFloat 18s ease-in-out infinite;
    }
    .blob-1 { width: 400px; height: 400px; background: #ffb347; top: -100px; left: -100px; }
    .blob-2 { width: 350px; height: 350px; background: #ff6b6b; bottom: -80px; right: -80px; animation-delay: -6s; }
    .blob-3 { width: 300px; height: 300px; background: #f5c518; top: 50%; left: 60%; animation-delay: -12s; }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.1); }
      66% { transform: translate(-30px, 30px) scale(0.95); }
    }

    /* ===== FLOATING EGG PARTICLES ===== */
    .particle {
      position: fixed;
      bottom: -60px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 30% 30%, #fff, #ffe0b2);
      opacity: 0.5;
      z-index: 0;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* ===== MAIN CARD ===== */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 60px 50px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(139, 26, 26, 0.18), 0 8px 24px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.6);
      animation: cardIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(60px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== BADGE ===== */
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold), #ff9f1c);
      color: #5c1010;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 20px;
      border-radius: 50px;
      margin-bottom: 24px;
      animation: badgePulse 2.5s ease-in-out infinite;
      box-shadow: 0 6px 20px rgba(245, 197, 24, 0.4);
    }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(245,197,24,0.4); }
      50% { transform: scale(1.05); box-shadow: 0 10px 30px rgba(245,197,24,0.6); }
    }

    /* ===== TITLE ===== */
    h1 {
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      color: var(--primary);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, #c0392b 60%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleGlow 3s ease-in-out infinite;
    }
    @keyframes titleGlow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(245,197,24,0)); }
      50% { filter: drop-shadow(0 4px 18px rgba(245,197,24,0.35)); }
    }

    /* ===== SUBTITLE ===== */
    .subtitle {
      color: #6b5b4e;
      font-size: 1.1rem;
      margin-bottom: 40px;
      animation: fadeUp 1s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== NAV GRID ===== */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-top: 10px;
    }

    .nav-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 26px 20px;
      background: linear-gradient(145deg, #ffffff, #fdf3e7);
      border-radius: 20px;
      text-decoration: none;
      color: var(--text);
      border: 2px solid rgba(139, 26, 26, 0.08);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease, border-color 0.4s ease;
      animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .nav-item:nth-child(1) { animation-delay: 0.5s; }
    .nav-item:nth-child(2) { animation-delay: 0.65s; }
    .nav-item:nth-child(3) { animation-delay: 0.8s; }
    .nav-item:nth-child(4) { animation-delay: 0.95s; }

    /* shine sweep */
    .nav-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
      transition: left 0.6s ease;
    }
    .nav-item:hover::before { left: 100%; }

    .nav-item:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 20px 45px rgba(139, 26, 26, 0.18);
      border-color: var(--primary);
    }

    .nav-item:active {
      transform: translateY(-2px) scale(0.98);
    }

    /* icon */
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      background: linear-gradient(135deg, var(--primary), #c0392b);
      color: #fff;
      box-shadow: 0 8px 20px rgba(139, 26, 26, 0.3);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
    }
    .nav-item:hover .icon {
      transform: rotate(-8deg) scale(1.15);
      box-shadow: 0 12px 28px rgba(139, 26, 26, 0.45);
    }

    .nav-item .label {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--primary);
    }
    .nav-item .desc {
      font-size: 0.85rem;
      color: #8a7a6a;
    }

    /* ===== FOOTER ===== */
    .footer {
      margin-top: 36px;
      font-size: 0.85rem;
      color: #9a8a7a;
      animation: fadeUp 1s 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .footer span {
      color: var(--primary);
      font-weight: 700;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 520px) {
      .card { padding: 40px 24px; }
      .nav-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Animated background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- Floating egg particles -->
  <div class="particle" style="left:5%; width:22px; height:28px; animation-duration:14s;"></div>
  <div class="particle" style="left:15%; width:14px; height:18px; animation-duration:18s; animation-delay:2s;"></div>
  <div class="particle" style="left:30%; width:18px; height:24px; animation-duration:16s; animation-delay:4s;"></div>
  <div class="particle" style="left:50%; width:12px; height:16px; animation-duration:20s; animation-delay:1s;"></div>
  <div class="particle" style="left:65%; width:20px; height:26px; animation-duration:15s; animation-delay:3s;"></div>
  <div class="particle" style="left:80%; width:16px; height:20px; animation-duration:19s; animation-delay:5s;"></div>
  <div class="particle" style="left:92%; width:24px; height:30px; animation-duration:13s; animation-delay:2.5s;"></div>

  <main class="card">
    <span class="badge">✦ Fresh & Crispy ✦</span>

    <h1>Vijaykumar's<br>Mutta Bonda Shop</h1>

    <p class="subtitle">Select a page to explore our delicious offerings</p>

    <nav class="nav-grid">
      <a class="nav-item" href="basic1.html">
        <div class="icon">🏠</div>
        <div class="label">Home</div>
        <div class="desc">Welcome & overview</div>
      </a>
      <a class="nav-item" href="basic2.html">
        <div class="icon">🎉</div>
        <div class="label">Promotions</div>
        <div class="desc">Deals & offers</div>
      </a>
      <a class="nav-item" href="basic3.html">
        <div class="icon">🍳</div>
        <div class="label">Menu</div>
        <div class="desc">Our tasty items</div>
      </a>
      <a class="nav-item" href="basic4.html">
        <div class="icon">📝</div>
        <div class="label">Order Form</div>
        <div class="desc">Place your order</div>
      </a>
    </nav>

    <p class="footer">Made with <span>❤</span> by Vijaykumar's Kitchen</p>
  </main>

</body>
</html>
